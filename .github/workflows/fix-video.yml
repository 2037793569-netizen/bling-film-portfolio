name: Repair animation playback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-video.yml', 'tools/fix-video-playback.py', 'tools/test-video-playback.cjs']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  repair:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install video tools
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
      - run: python tools/fix-video-playback.py
      - run: node --check dist/app.js
      - name: Install browser test
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify animations in browser
        run: |
          python -m http.server 8765 --directory dist >/tmp/portfolio-http.log 2>&1 &
          node tools/test-video-playback.cjs
      - name: Save tested playback fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist tools/video-report.json
          git commit -m 'Use compact buffered videos and restore smooth animation playback'
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
