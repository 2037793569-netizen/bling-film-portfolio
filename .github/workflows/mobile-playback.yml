name: Repair mobile playback
on:
  push:
    branches: [main]
    paths: ['tools/fix-mobile-playback.py', 'tools/test-mobile-playback.cjs', '.github/workflows/mobile-playback.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  repair:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python tools/fix-mobile-playback.py
      - run: node --check dist/app.js
      - name: Install mobile browser engines
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Verify mobile and desktop interactions
        run: |
          node tools/serve-media.cjs >/tmp/portfolio-http.log 2>&1 &
          node tools/test-mobile-playback.cjs
          python - <<'PY'
          from pathlib import Path
          source=Path('tools/test-video-playback.cjs').read_text()
          source=source.replace('evaluate(c=>c.width),1280','evaluate(c=>c.width),2560')
          Path('tools/test-desktop-mobile-fix.cjs').write_text(source)
          PY
          node tools/test-desktop-mobile-fix.cjs
      - name: Save verified mobile repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          if ! git diff --cached --quiet; then
            git commit -m 'Fix mobile native video layers, inline playback and swipe navigation'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
